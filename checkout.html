<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Volkhov:wght@400;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet" />

    <!-- Digital Numbers Font -->
    <link href="https://fonts.cdnfonts.com/css/digital-numbers" rel="stylesheet" />
    <title>Shopping Product</title>

    <style type="text/tailwindcss">
        @theme {
            /* Colors */
            --color-heather-grey: #484848;
            --color-grey-900: #8a8a8a;
            --color-grey-600: #767676;
            --color-grey-700: #e0e0e0;
            --color-light-gray:#EEEEEE;
            --color-grey-800: #d9d9d9;
            --color-black-900: #000000;
            --color-white-900: #ffffff;
            --color-white-700: #fafafa;
            --color-red-500: #ff4646;

            /* Fonts */
            --font-poppins: "Poppins", sans-serif;
            --font-volkhov: "Volkhov", serif;
            --font-digital: "Digital Numbers", sans-serif;
            --font-jost: "Jost", sans-serif;
        }
        .nav-name {
            @apply font-poppins text-[16px] leading-[100%] text-heather-grey hover:text-black-900;
        }

        .navbar {
            @apply flex items-center;
        }

        .btn-black {
            @apply bg-black-900 text-white-900 rounded-[10px] font-poppins hover:bg-heather-grey transition-colors;
        }
    </style>
</head>

</html>

<body>
    <!-- Header -->
    <header id="top" class="flex items-center justify-between px-10 mx-auto max-w-[1070px] py-5">

        <!-- Logo -->
        <a href="#" aria-label="FASCO home" class="shrink-0">
            <h1 class="font-volkhov text-[40px] leading-[100%] text-heather-grey">
                FASCO
            </h1>
        </a>

        <!-- Navigation -->
        <nav class="navbar gap-8">
            <a href="#home" class="nav-name">Home</a>
            <a href="#Deals" class="nav-name">Shop</a>
            <a href="#arrivale" class="nav-name border-b border-heather-grey py-[10px]">Products</a>
            <a href="#package" class="nav-name">Pages</a>
        </nav>

        <!-- Header Icons -->
        <div class="flex items-center gap-4">
            <a href="#" aria-label="Search">
                <img src="./assets-product/icon-search.svg" alt="Search" class="w-6 h-6" />
            </a>

            <a href="#" aria-label="Shopping cart">
                <img src="./assets-product/icon-user.svg" alt="User account" class="w-6 h-6" />
            </a>

            <a href="#" aria-label="User account">
                <img src="./assets-product/icon-star.svg" alt="Pin Shoping" class="w-6 h-6" />
            </a>
            <a href="#" aria-label="User account">
                <img src="./assets-product/icon-wallet.svg" alt="Shopping cart " class="w-6 h-6" />
            </a>
        </div>

    </header>
    <div class="flex gap-5 shrink-0 justify-center gap-[60px] mt-[78px] mb-[44px]">
        <h2 class="font-volkhov text-[42px] leading-[32px] text-black-900">FASCO Demo Checkout</h2>
    </div>

    <!-- Main Content -->
    <main class="border-t border-black-900/39">
        <!-- section 1: -->
        <section class="mt-[78px]">
            <div class="flex items-stretch">
                <!-- LEFT: form -->
                <div class="w-1/2 flex justify-end py-5 pr-[60px] pl-5">
                    <form class="w-full max-w-[505px]">
                        <!-- email input -->
                        <div>
                            <div class="flex items-center justify-between gap-[60px] mb-[26px]">
                                <h3 class="font-volkhov text-[46px] leading-[100%] text-heather-grey">
                                    Contact
                                </h3>
                                <span
                                    class="font-poppins text-[16px] leading-[100%] text-heather-grey whitespace-nowrap">
                                    Have an account?
                                    <a href="#" class="text-[#1456FF]">Create Account</a>
                                </span>
                            </div>
                            <input type="email" name="email" class="border border-gray-900 h-[71px] pl-[28px] w-full"
                                placeholder="Email Address">
                        </div>

                        <!-- delivery -->
                        <div>
                            <div class="flex items-center justify-between mt-[60px] mb-[26px]">
                                <h3 class="font-volkhov text-[46px] leading-[100%] text-heather-grey">Delivery</h3>
                            </div>
                            <div class="space-y-[16px]">
                                <div class="relative">
                                    <input type="text" name="country"
                                        class="border border-gray-900 h-[71px] pl-[28px] w-full"
                                        placeholder="Country / Region">
                                    <img src="./assets-product/icon-down.svg"
                                        class="absolute top-1/2 -translate-y-1/2 right-[31px]" alt="down icon">
                                </div>
                                <div class="flex gap-[12px]">
                                    <input type="text" name="first_name"
                                        class="border border-gray-900 h-[71px] pl-[28px] w-full"
                                        placeholder="First Name">
                                    <input type="text" name="last_name"
                                        class="border border-gray-900 h-[71px] pl-[28px] w-full"
                                        placeholder="Last Name">
                                </div>
                                <input type="text" name="address"
                                    class="border border-gray-900 h-[71px] pl-[28px] w-full" placeholder="Address">
                                <div class="flex gap-[12px]">
                                    <input type="text" name="city"
                                        class="border border-gray-900 h-[71px] pl-[28px] w-full" placeholder="City">
                                    <input type="text" name="postal_code"
                                        class="border border-gray-900 h-[71px] pl-[28px] w-full"
                                        placeholder="Postal Code">
                                </div>
                                <label class="flex gap-[10px] items-center w-fit">
                                    <input type="checkbox" class="size-5 accent-black">
                                    <span class="font-poppins text-[16px] leading-[42px] text-grey-900">Save This Info
                                        for future</span>
                                </label>
                            </div>
                        </div>

                        <!-- payment -->
                        <div>
                            <div class="flex items-center justify-between mt-[60px] mb-[26px]">
                                <h3 class="font-volkhov text-[46px] leading-[100%] text-heather-grey">Payment</h3>
                            </div>
                            <div
                                class="flex justify-between border border-gray-900 py-[24px] pl-[23px] pr-[32px] items-center">
                                <span class="font-poppins text-[16px] leading-[100%] text-grey-900">Credit Card</span>
                                <div class="flex gap-[8px] items-center">
                                    <img src="./checkout-image/mistercard.svg" alt="master-card">
                                    <img src="./assets-product/icon-down.svg" class="w-[12px] h-[8px]" alt="down icon">
                                </div>
                            </div>
                            <div class="bg-[#F5F5F5]">
                                <div class="px-[20px] space-y-[24px]">
                                    <div class="relative pt-[18px]">
                                        <input type="text" name="card_number"
                                            class="border border-gray-900 h-[67px] pl-[28px] w-full rounded-[1px] bg-white-900"
                                            placeholder="Card Number">
                                        <img src="./checkout-image/Vector.svg" class="absolute top-[45px] right-[31px]"
                                            alt="lock icon">
                                    </div>
                                    <div class="flex gap-[12px]">
                                        <input type="text" name="expiration"
                                            class="border border-gray-900 h-[71px] pl-[28px] w-full rounded-[1px] bg-white-900"
                                            placeholder="Expiration Date">
                                        <input type="text" name="security_code"
                                            class="border border-gray-900 h-[71px] pl-[28px] w-full rounded-[1px] bg-white-900"
                                            placeholder="Security Code">
                                    </div>
                                    <input type="text" name="card_holder"
                                        class="border border-gray-900 h-[71px] pl-[28px] w-full rounded-[1px] bg-white-900"
                                        placeholder="Card Holder Name">
                                    <label class="flex gap-[10px] items-center w-fit pb-[28px]">
                                        <input type="checkbox" class="size-5 accent-black">
                                        <span class="font-poppins text-[16px] leading-[42px] text-grey-900">Save This
                                            Info for future</span>
                                    </label>
                                </div>
                            </div>
                            <button type="submit"
                                class="w-full mt-[29px] bg-black-900 h-[66px] text-white-900 rounded-[10px]">
                                Pay Now
                            </button>
                            <span class="flex justify-center mt-[36px]">Copyright &copy; 2022 FASCO . All Rights
                                Reserved.</span>
                        </div>
                    </form>
                </div>

                <!-- RIGHT: full height of the row -->
                <div class="relative w-1/2 h-[960px] bg-[#F5F5F5] pt-[52px] space-y-[26px]">
                    <div class="flex justify-evenly items-center">
                        <img src="./checkout-image/red-girl.svg" alt="red-girl">
                        <div>
                            <p class="font-volkhov text-[18px] leading-[100%] text-black-900">Mini dress with ruffled
                                straps</p>
                            <span class="font-poppins text-[16px] leading-[100%] text-grey-900">Red</span>
                        </div>
                        <span class="font-poppins text-[16px] leading-[100%] text-grey-900">$100.00</span>

                    </div>
                    <div class="pl-[46px] flex gap-[17px]">
                        <input type="text" name="last_name" class="border border-gray-900 bg-white-900 h-[71px] pl-[28px] w-[380px]"
                            placeholder="Discount code">
                        <button class="bg-black-900 w-[162px] text-white-900 rounded-[10px] font-poppins text-[16px] leading-[100%] ">Apply</button>
                            
                    </div>

                </div>
            </div>
        </section>
    </main>
</body>
