<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Volkhov:wght@400;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet" />

    <!-- Digital Numbers Font -->
    <link href="https://fonts.cdnfonts.com/css/digital-numbers" rel="stylesheet" />
    <title>Shopping Product</title>

    <style type="text/tailwindcss">
        @theme {
            /* Colors */
            --color-heather-grey: #484848;
            --color-grey-900: #8a8a8a;
            --color-grey-600: #767676;
            --color-grey-700: #e0e0e0;
            --color-light-gray:#EEEEEE;
            --color-grey-800: #d9d9d9;
            --color-black-900: #000000;
            --color-white-900: #ffffff;
            --color-white-700: #fafafa;
            --color-red-500: #ff4646;

            /* Fonts */
            --font-poppins: "Poppins", sans-serif;
            --font-volkhov: "Volkhov", serif;
            --font-digital: "Digital Numbers", sans-serif;
            --font-jost: "Jost", sans-serif;
        }
        .nav-name {
            @apply font-poppins text-[16px] leading-[100%] text-heather-grey hover:text-black-900;
        }

        .navbar {
            @apply flex items-center;
        }

        .btn-black {
            @apply bg-black-900 text-white-900 rounded-[10px] font-poppins hover:bg-heather-grey transition-colors;
        }
        .span-text{
            @apply font-poppins text-[16px] leading-[100%] text-grey-900;
        }

        /* ============================================================
           Page sections (utilities moved out of the HTML)
           ============================================================ */
        /* ===== Header ===== */
        .header-bar {
          @apply flex items-center justify-between px-10 mx-auto max-w-[1070px] py-5;
        }
        .logo-link {
          @apply shrink-0;
        }
        .logo-title {
          @apply font-volkhov text-[40px] leading-[100%] text-heather-grey;
        }
        .nav-main {
          @apply gap-8;
        }
        .nav-active {
          @apply border-b border-heather-grey py-[10px];
        }
        .header-icons {
          @apply flex items-center gap-4;
        }
        .header-icon {
          @apply w-6 h-6;
        }

        /* ===== Page title ===== */
        .checkout-heading {
          @apply flex gap-5 shrink-0 justify-center gap-[60px] mt-[78px] mb-[44px];
        }
        .checkout-title {
          @apply font-volkhov text-[42px] leading-[32px] text-black-900;
        }

        /* ===== Checkout layout ===== */
        .checkout-main {
          @apply border-t border-black-900/39;
        }
        .checkout-section {
          @apply mt-[78px];
        }
        .checkout-layout {
          @apply flex items-stretch;
        }

        /* ===== Checkout form (contact, delivery, payment) ===== */
        .checkout-form-col {
          @apply w-1/2 flex justify-end py-5 pr-[60px] pl-5;
        }
        .checkout-form {
          @apply w-full max-w-[505px];
        }
        .contact-header {
          @apply flex items-center justify-between gap-[60px] mb-[26px];
        }
        .form-section-title {
          @apply font-volkhov text-[46px] leading-[100%] text-heather-grey;
        }
        .contact-account {
          @apply font-poppins text-[16px] leading-[100%] text-heather-grey whitespace-nowrap;
        }
        .contact-account-link {
          @apply text-[#1456FF];
        }
        .form-input {
          @apply border border-gray-900 h-[71px] pl-[28px] w-full;
        }
        .form-section-header {
          @apply flex items-center justify-between mt-[60px] mb-[26px];
        }
        .delivery-fields {
          @apply space-y-[16px];
        }
        .field-wrapper {
          @apply relative;
        }
        .field-icon-down {
          @apply absolute top-1/2 -translate-y-1/2 right-[31px];
        }
        .field-row {
          @apply flex gap-[12px];
        }
        .save-info {
          @apply flex gap-[10px] items-center w-fit;
        }
        .save-info-checkbox {
          @apply size-5 accent-black;
        }
        .save-info-text {
          @apply font-poppins text-[16px] leading-[42px] text-grey-900;
        }
        .payment-method {
          @apply flex justify-between border border-gray-900 py-[24px] pl-[23px] pr-[32px] items-center;
        }
        .payment-method-input {
          @apply font-poppins text-[16px] leading-[100%] text-grey-900 outline-none;
        }
        .payment-method-icons {
          @apply flex gap-[8px] items-center;
        }
        .payment-down-icon {
          @apply w-[12px] h-[8px];
        }
        .card-details {
          @apply bg-[#F5F5F5];
        }
        .card-details-inner {
          @apply px-[20px] space-y-[24px];
        }
        .card-number-wrapper {
          @apply relative pt-[18px];
        }
        .card-number-input {
          @apply border border-gray-900 h-[67px] pl-[28px] w-full bg-white-900;
        }
        .card-lock-icon {
          @apply absolute top-[45px] right-[31px];
        }
        .card-input {
          @apply border border-gray-900 h-[71px] pl-[28px] w-full bg-white-900;
        }
        .save-info-card {
          @apply flex gap-[10px] items-center w-fit pb-[28px];
        }
        .pay-btn {
          @apply w-full mt-[29px] bg-black-900 h-[66px] text-white-900 rounded-[10px];
        }
        .checkout-copyright {
          @apply flex justify-center mt-[36px];
        }

        /* ===== Order summary ===== */
        .summary-col {
          @apply relative w-1/2 h-[960px] bg-[#F5F5F5] pt-[52px] space-y-[26px];
        }
        .summary-item {
          @apply flex pl-[46px] gap-[40px] items-center;
        }
        .summary-item-name {
          @apply font-volkhov text-[18px] leading-[100%] text-black-900;
        }
        .summary-item-meta {
          @apply font-poppins text-[16px] leading-[100%] text-grey-900;
        }
        .summary-item-price {
          @apply font-poppins text-[16px] leading-[100%] text-grey-900;
        }
        .discount-row {
          @apply pl-[46px] flex gap-[17px];
        }
        .discount-input {
          @apply border border-gray-900 bg-white-900 h-[71px] pl-[28px] w-[380px];
        }
        .discount-btn {
          @apply bg-black-900 w-[162px] text-white-900 rounded-[10px] font-poppins text-[16px] leading-[100%];
        }
        .summary-totals {
          @apply pt-[52px] space-y-[12px] pl-[46px] w-[580px];
        }
        .summary-line {
          @apply flex justify-between;
        }
    </style>
</head>

</html>

<body>
    <!-- Header -->
    <header id="top" class="header-bar">

        <!-- Logo -->
        <a href="#" aria-label="FASCO home" class="logo-link">
            <h1 class="logo-title">
                FASCO
            </h1>
        </a>

        <!-- Navigation -->
        <nav class="navbar nav-main">
            <a href="#home" class="nav-name">Home</a>
            <a href="#Deals" class="nav-name">Shop</a>
            <a href="#arrivale" class="nav-name nav-active">Products</a>
            <a href="#package" class="nav-name">Pages</a>
        </nav>

        <!-- Header Icons -->
        <div class="header-icons">
            <a href="#" aria-label="Search">
                <img src="./assets-product/icon-search.svg" alt="Search" class="header-icon" />
            </a>

            <a href="#" aria-label="Shopping cart">
                <img src="./assets-product/icon-user.svg" alt="User account" class="header-icon" />
            </a>

            <a href="#" aria-label="User account">
                <img src="./assets-product/icon-star.svg" alt="Pin Shoping" class="header-icon" />
            </a>
            <a href="#" aria-label="User account">
                <img src="./assets-product/icon-wallet.svg" alt="Shopping cart " class="header-icon" />
            </a>
        </div>

    </header>
    <div class="checkout-heading">
        <h2 class="checkout-title">FASCO Demo Checkout</h2>
    </div>

    <!-- Main Content -->
    <main class="checkout-main">
        <!-- section 1: -->
        <section class="checkout-section">
            <div class="checkout-layout">
                <!-- LEFT: form -->
                <div class="checkout-form-col">
                    <form class="checkout-form">
                        <!-- email input -->
                        <div>
                            <div class="contact-header">
                                <h3 class="form-section-title">
                                    Contact
                                </h3>
                                <span
                                    class="contact-account">
                                    Have an account?
                                    <a href="#" class="contact-account-link">Create Account</a>
                                </span>
                            </div>
                            <input type="email" name="email" class="form-input"
                                placeholder="Email Address">
                        </div>

                        <!-- delivery -->
                        <div>
                            <div class="form-section-header">
                                <h3 class="form-section-title">Delivery</h3>
                            </div>
                            <div class="delivery-fields">
                                <div class="field-wrapper">
                                    <input type="text" name="country"
                                        class="form-input"
                                        placeholder="Country / Region">
                                    <img src="./assets-product/icon-down.svg"
                                        class="field-icon-down" alt="down icon">
                                </div>
                                <div class="field-row">
                                    <input type="text" name="first_name"
                                        class="form-input"
                                        placeholder="First Name">
                                    <input type="text" name="last_name"
                                        class="form-input"
                                        placeholder="Last Name">
                                </div>
                                <input type="text" name="address"
                                    class="form-input" placeholder="Address">
                                <div class="field-row">
                                    <input type="text" name="city"
                                        class="form-input" placeholder="City">
                                    <input type="text" name="postal_code"
                                        class="form-input"
                                        placeholder="Postal Code">
                                </div>
                                <label class="save-info">
                                    <input type="checkbox" class="save-info-checkbox">
                                    <span class="save-info-text">Save This Info
                                        for future</span>
                                </label>
                            </div>
                        </div>

                        <!-- payment -->
                        <div>
                            <div class="form-section-header">
                                <h3 class="form-section-title">Payment</h3>
                            </div>
                            <div
                                class="payment-method">
                                <input type="text" placeholder="Credit Card"
                                    class="payment-method-input">

                                <div class="payment-method-icons">
                                    <img src="./checkout-image/mistercard.svg" alt="Mastercard">
                                    <img src="./assets-product/icon-down.svg" class="payment-down-icon" alt="down icon">
                                </div>
                            </div>
                            <div class="card-details">
                                <div class="card-details-inner">
                                    <div class="card-number-wrapper">
                                        <input type="text" name="card_number"
                                            class="card-number-input"
                                            placeholder="Card Number">
                                        <img src="./checkout-image/Vector.svg" class="card-lock-icon"
                                            alt="lock icon">
                                    </div>
                                    <div class="field-row">
                                        <input type="text" name="expiration"
                                            class="card-input"
                                            placeholder="Expiration Date">
                                        <input type="text" name="security_code"
                                            class="card-input"
                                            placeholder="Security Code">
                                    </div>
                                    <input type="text" name="card_holder"
                                        class="card-input"
                                        placeholder="Card Holder Name">
                                    <label class="save-info-card">
                                        <input type="checkbox" class="save-info-checkbox">
                                        <span class="save-info-text">Save This
                                            Info for future</span>
                                    </label>
                                </div>
                            </div>
                            <button type="submit"
                                class="pay-btn">
                                Pay Now
                            </button>
                            <span class="checkout-copyright">Copyright &copy; 2022 FASCO . All Rights
                                Reserved.</span>
                        </div>
                    </form>
                </div>

                <!-- RIGHT: full height of the row -->
                <div class="summary-col">
                    <div class="summary-item">
                        <img src="./checkout-image/red-girl.svg" alt="red-girl">
                        <div>
                            <p class="summary-item-name">Mini dress with ruffled
                                straps</p>
                            <span class="summary-item-meta">Red</span>
                        </div>
                        <span class="summary-item-price">$100.00</span>

                    </div>
                    <div class="discount-row">
                        <input type="text" name="last_name"
                            class="discount-input"
                            placeholder="Discount code">
                        <button
                            class="discount-btn">Apply</button>

                    </div>
                    <div class="summary-totals">
                        <div class="summary-line">
                            <span class="span-text">Subtotal</span>
                            <span class="span-text">$100.00</span>
                        </div>
                        <div class="summary-line">
                            <span class="span-text">Shipping</span>
                            <span class="span-text">$40.00</span>
                        </div>
                        <div class="summary-line">
                            <span class="span-text">Total</span>
                            <span class="span-text">$140.00</span>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>
</body>
