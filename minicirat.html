<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Volkhov:wght@400;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet" />

    <!-- Digital Numbers Font -->
    <link href="https://fonts.cdnfonts.com/css/digital-numbers" rel="stylesheet" />
    <title>Shopping Product</title>

    <style type="text/tailwindcss">
        @theme {
            /* Colors */
            --color-heather-grey: #484848;
            --color-grey-900: #8a8a8a;
            --color-grey-600: #767676;
            --color-grey-700: #e0e0e0;
            --color-grey-800: #d9d9d9;
            --color-black-900: #000000;
            --color-white-900: #ffffff;
            --color-white-700: #fafafa;
            --color-red-500: #ff4646;

            /* Fonts */
            --font-poppins: "Poppins", sans-serif;
            --font-volkhov: "Volkhov", serif;
            --font-digital: "Digital Numbers", sans-serif;
            --font-jost: "Jost", sans-serif;
        }

        .nav-name {
            @apply font-poppins text-[16px] leading-[100%] text-heather-grey hover:text-black-900;
        }

        .navbar {
            @apply flex items-center;
        }

        .btn-black {
            @apply bg-black-900 text-white-900 rounded-[10px] font-poppins hover:bg-heather-grey transition-colors;
        }
        .div-active{
            @apply border border-black-900 w-fit p-[6px];
        }
        .number-time{
            @apply font-jost font-semibold text-[20px] leading-[32px] text-[#FF706B] px-[2px];
        }
        .span-picky{
            @apply absolute z-30 flex items-center justify-center w-[6.43%] h-[6.35%] border border-[#000000] bg-white/60 text-[11px] whitespace-nowrap;
        }
        .number-time {
            @apply font-digital text-[32px] leading-[100%] text-heather-grey;
        }
        .zone-span {
            @apply font-poppins text-[24px] leading-[120%] text-heather-grey;
        }
        .div-span {
            @apply flex flex-col items-center bg-white-900 py-[12px] px-[22px] shadow-[0px_4px_14px_1px_#00000029] rounded-[10px];
        }
        .button-click {
            @apply flex h-[48px] w-[48px] items-center justify-center rounded-full border border-gray-300 bg-white shadow-md hover:bg-gray-100;
        }
         .span {
            @apply w-3 h-3 rounded-full bg-grey-800;
        }
    </style>
</head>

<body class="bg-white-900">

    <!-- Header -->
    <header id="top" class="flex items-center justify-between px-10 mx-auto max-w-[1070px] py-5">

        <!-- Logo -->
        <a href="#" aria-label="FASCO home" class="shrink-0">
            <h1 class="font-volkhov text-[40px] leading-[100%] text-heather-grey">
                FASCO
            </h1>
        </a>

        <!-- Navigation -->
        <nav class="navbar gap-8">
            <a href="#home" class="nav-name">Home</a>
            <a href="#Deals" class="nav-name">Shop</a>
            <a href="#arrivale" class="nav-name border-b border-heather-grey py-[10px]">Products</a>
            <a href="#package" class="nav-name">Pages</a>
        </nav>

        <!-- Header Icons -->
        <div class="flex items-center gap-4">
            <a href="#" aria-label="Search">
                <img src="./assets-product/icon-search.svg" alt="Search" class="w-6 h-6" />
            </a>

            <a href="#" aria-label="Shopping cart">
                <img src="./assets-product/icon-user.svg" alt="User account" class="w-6 h-6" />
            </a>

            <a href="#" aria-label="User account">
                <img src="./assets-product/icon-star.svg" alt="Pin Shoping" class="w-6 h-6" />
            </a>
            <a href="#" aria-label="User account">
                <img src="./assets-product/icon-wallet.svg" alt="Shopping cart " class="w-6 h-6" />
            </a>
        </div>

    </header>
</body>
